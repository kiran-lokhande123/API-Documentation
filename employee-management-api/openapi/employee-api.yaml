
openapi: 3.0.3

info:
  title: Employee Management API
  description: API documentation for the fictional Employee Management system.
  version: 1.0.0

servers:
  - url: https://api.employee-demo.com/v1
    description: Employee Demo Server

paths:
  /employees:
    get:
      summary: Retrieve all employees
      description: Retrieves a list of all employees.
      operationId: getEmployees

      responses:
        '200':
          description: Employees retrieved successfully.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'
              example:
                - employeeId: EMP1001
                  firstName: John
                  lastName: Smith
                  email: john.smith@example.com
                  department: Engineering
                - employeeId: EMP1002
                  firstName: Sarah
                  lastName: Williams
                  email: sarah.williams@example.com
                  department: Human Resources

    post:
      summary: Create a new employee
      description: Creates a new employee record.
      operationId: createEmployee

      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
            example:
              firstName: David
              lastName: Miller
              email: david.miller@example.com
              department: Finance

      responses:
        '201':
          description: Employee created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                employeeId: EMP1003
                firstName: David
                lastName: Miller
                email: david.miller@example.com
                department: Finance

        '400':
          description: Invalid employee information provided.

  /employees/{employeeId}:
    get:
      summary: Retrieve an employee by ID
      description: Retrieves employee details using the employee ID.
      operationId: getEmployeeById

      parameters:
        - name: employeeId
          in: path
          required: true
          description: Unique identifier of the employee.
          schema:
            type: string
          example: EMP1001

      responses:
        '200':
          description: Employee retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
              example:
                employeeId: EMP1001
                firstName: John
                lastName: Smith
                email: john.smith@example.com
                department: Engineering

        '404':
          description: Employee not found.

components:
  schemas:
    Employee:
      type: object
      description: Represents an employee record.
      properties:
        employeeId:
          type: string
          description: Unique identifier of the employee.
          example: EMP1001
        firstName:
          type: string
          description: Employee's first name.
          example: John
        lastName:
          type: string
          description: Employee's last name.
          example: Smith
        email:
          type: string
          format: email
          description: Employee's email address.
          example: john.smith@example.com
        department:
          type: string
          description: Department to which the employee belongs.
          example: Engineering
      required:
        - employeeId
        - firstName
        - lastName
        - email
        - department

    EmployeeInput:
      type: object
      description: Employee information provided when creating a new employee.
      properties:
        firstName:
          type: string
          example: David
        lastName:
          type: string
          example: Miller
        email:
          type: string
          format: email
          example: david.miller@example.com
        department:
          type: string
          example: Finance
      required:
        - firstName
        - lastName
        - email
        - department
